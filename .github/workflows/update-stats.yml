name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (use "0 6 * * *" for once a day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stat cards
        run: |
          mkdir -p profile

          # Download a card; only replace the old file if the response is a real SVG
          fetch() {
            url="$1"; out="$2"
            if curl -fsSL --retry 3 --max-time 60 "$url" -o "$out.tmp" && grep -q "<svg" "$out.tmp"; then
              mv "$out.tmp" "$out"
              echo "Updated $out"
            else
              rm -f "$out.tmp"
              echo "Could not update $out, keeping the old one"
            fi
          }

          COLORS="hide_border=true&bg_color=0A0A12&title_color=F5A524&icon_color=6B6FF0&text_color=C9D1D9"

          fetch "https://github-readme-stats.vercel.app/api?username=WaleedAhmed10&show_icons=true&include_all_commits=true&${COLORS}" profile/stats.svg

          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=WaleedAhmed10&layout=compact&langs_count=8&${COLORS}" profile/top-langs.svg

          fetch "https://streak-stats.demolab.com/?user=WaleedAhmed10&background=0A0A12&stroke=6B6FF0&border=6B6FF0&ring=F5A524&fire=F5A524&currStreakLabel=F5A524&currStreakNum=FFFFFF&sideNums=FFFFFF&sideLabels=C9D1D9&dates=8B949E" profile/streak.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update stats cards"
            git push
          fi
