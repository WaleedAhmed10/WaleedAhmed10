name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate stats.svg
        run: |
          curl -L "https://github-readme-stats.vercel.app/api?username=WaleedAhmed10&show_icons=true&theme=dark" -o profile/stats.svg

      - name: Generate top-langs.svg
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=WaleedAhmed10&layout=compact&theme=dark&langs_count=6" -o profile/top-langs.svg

      - name: Generate streak.svg
        run: |
          curl -L "https://streak-stats.demolab.com/?user=WaleedAhmed10&theme=dark" -o profile/streak.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update stats cards"
          git push
